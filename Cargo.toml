[package]
name = "cosmic-applet-ledger"
version = "0.2.1"
edition = "2024"
license = "MPL-2.0"
description = "COSMIC panel applet tracking AI usage and credits"
repository = "https://github.com/mrn3ff/cosmic-applet-ledger"

[package.metadata.deb]
name = "cosmic-applet-ledger"
maintainer = "netw0rkn1nja <mrn3ff@users.noreply.github.com>"
depends = "$auto, libxkbcommon0, libwayland-client0, libfontconfig1"
# Releases up to 0.2.0 shipped as "ledger", which collides with the
# unrelated Debian/Ubuntu `ledger` accounting package (3.x). Take over
# files from those builds so they upgrade cleanly.
replaces = "ledger (<< 0.2.1)"
breaks = "ledger (<< 0.2.1)"
section = "utils"
priority = "optional"
assets = [
    ["target/release/cosmic-applet-ledger", "usr/bin/", "755"],
    ["resources/app.desktop", "usr/share/applications/io.github.mrn3ff.cosmic-applet-ledger.desktop", "644"],
    ["resources/app.metainfo.xml", "usr/share/metainfo/io.github.mrn3ff.cosmic-applet-ledger.metainfo.xml", "644"],
    ["resources/ledger-icon/linux/hicolor/scalable/apps/ledger.svg", "usr/share/icons/hicolor/scalable/apps/io.github.mrn3ff.cosmic-applet-ledger.svg", "644"],
    ["resources/ledger-icon/linux/hicolor/symbolic/apps/ledger-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/io.github.mrn3ff.cosmic-applet-ledger-symbolic.svg", "644"],
    ["README.md", "usr/share/doc/cosmic-applet-ledger/README.md", "644"],
]
extended-description = """
Ledger is a native COSMIC panel applet that tracks AI usage, quotas, and \
prepaid credits across coding agents and API providers.
"""

[package.metadata.generate-rpm]
summary = "COSMIC panel applet for AI coding usage tracking"
license = "MPL-2.0"
assets = [
    { source = "target/release/cosmic-applet-ledger", dest = "/usr/bin/cosmic-applet-ledger", mode = "755" },
    { source = "resources/app.desktop", dest = "/usr/share/applications/io.github.mrn3ff.cosmic-applet-ledger.desktop", mode = "644" },
    { source = "resources/app.metainfo.xml", dest = "/usr/share/metainfo/io.github.mrn3ff.cosmic-applet-ledger.metainfo.xml", mode = "644" },
    { source = "resources/ledger-icon/linux/hicolor/scalable/apps/ledger.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.mrn3ff.cosmic-applet-ledger.svg", mode = "644" },
    { source = "resources/ledger-icon/linux/hicolor/symbolic/apps/ledger-symbolic.svg", dest = "/usr/share/icons/hicolor/symbolic/apps/io.github.mrn3ff.cosmic-applet-ledger-symbolic.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/cosmic-applet-ledger/README.md", mode = "644", doc = true },
]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
i18n-embed-fl = "0.10"
libc = "0.2"
notify = "8"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dependencies.i18n-embed]
version = "0.16"
features = ["fluent-system", "desktop-requester"]

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
features = [
    # Applet support
    "applet",
    "applet-token",
    # Uses cosmic-settings-daemon to watch for config file changes
    "dbus-config",
    # Support creating additional application windows.
    "multi-window",
    # Uses tokio as the executor for the runtime
    "tokio",
    # Add Wayland support to winit
    "wayland",
    # Windowing support for X11, Windows, Mac, & Redox
    "winit",
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }
