  THROWAWAY PROTOTYPE — browser model of the YapCap COSMIC popup.
  Single provider-account layout based on the selected F design; Cursor starts with no accounts; no state persists after a reload.
  Open directly in a browser, or run: python3 -m http.server -d . 8000
-->
<!doctype html>
<html lang="en">

  <title>YapCap UI prototype</title>
  <style>

    button,input { font:inherit } button { color:inherit; border:0; cursor:pointer } .popup { width:min(100vw,396px); height:min(100vh,671px); background:var(--bg); border:1px solid #4b4f59; box-shadow:0 24px 70px #0009; display:flex; flex-direction:column; overflow:hidden; }
    .chrome { padding:16px 16px 0 } .header { height:36px; display:flex; align-items:center; gap:8px } .header .spacer { flex:1 } .title { margin-right:auto; padding:0; background:transparent; font-size:22px; font-weight:650; letter-spacing:-.4px } .button,.icon-button { background:#383b45; border:1px solid #4b4f59; border-radius:8px; padding:7px 10px; transition:.15s } .button:hover,.icon-button:hover,.tab:hover,.choice:hover { background:#454956 } .icon-button { position:relative; min-width:31px; padding:6px 9px; font-size:17px; line-height:18px } .header-action { width:34px; height:34px; padding:5px; font-size:21px; line-height:20px } .notification-dot { position:absolute; top:-5px; right:-5px; width:12px; height:12px; border:2px solid var(--bg); border-radius:50%; background:#ff4f5e; box-shadow:0 0 7px #ff4f5ecc } .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding-top:14px } .tab { min-height:60px; padding:6px 4px; background:#292c33; border:1px solid #3a3e47; border-radius:8px; display:grid; place-items:center; gap:2px; color:var(--muted); font-size:10px } .tab.active { color:var(--text); background:var(--accent-soft); border-color:var(--accent) } .tab img { width:16px; height:16px; object-fit:contain } .body { flex:1; overflow:auto; padding:14px 16px 12px; scrollbar-width:thin } .footer { display:flex; align-items:center; padding:0 16px 16px; height:50px; gap:10px } .footer .spacer { flex:1 } .text-button { background:transparent; color:var(--muted); padding:7px 4px } .text-button:hover { color:var(--text) }
    .card,.settings-block { background:var(--panel); border:1px solid #383c45; border-radius:10px; padding:12px; margin-bottom:8px } .provider-header { display:flex; gap:10px; align-items:center; min-height:42px; padding:2px 4px 10px } .provider-header img { width:27px; height:27px; object-fit:contain } .provider-header strong { display:block; font-size:15px } .badge { margin-left:auto; font-size:11px; padding:3px 7px; border-radius:999px; background:#263d31; color:var(--green); white-space:nowrap }.badge.warn { color:var(--yellow); background:#443b24 }.badge.dim { color:var(--muted); background:#383b43 }.account-pager { min-height:40px; display:grid; grid-template-columns:32px 1fr 32px; align-items:center; text-align:center; margin-bottom:8px }.pager-button { background:transparent; color:var(--muted); font-size:22px; padding:5px }.pager-button:hover { color:var(--text) }.account-pager strong { font-size:13px }.account-pager small { display:block; color:var(--muted); font-size:11px; margin-top:2px }.card-title { color:var(--muted); font-size:12px; margin-bottom:6px }.account { display:flex; gap:8px; align-items:center }.account strong { font-size:14px }.account .sub { color:var(--muted); font-size:12px }.plan { margin-left:auto; padding:2px 7px; border-radius:7px; background:#444752; font-size:11px; color:#e1e3ed }.card-meta { display:flex; margin-top:9px; align-items:center; gap:7px; color:var(--muted); font-size:12px }.updated { margin-left:auto }.section-title { display:flex; justify-content:space-between; margin:5px 0 8px; color:#daddE8; font-size:14px }.section-title small { color:var(--muted) }.meter { height:9px; border-radius:8px; background:#17191e; overflow:hidden; margin:8px 0 7px }.meter > span { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,#7387f5,#9f8df9) }.meter.green > span { background:linear-gradient(90deg,#50bb85,#80dba8) }.window-card { background:var(--card); padding:12px; border-radius:8px; margin-bottom:8px }.window-info { display:flex; justify-content:space-between; align-items:baseline }.window-info strong { font-size:18px }.window-info small { color:var(--muted) }.pace { font-size:11px; color:var(--green) }.empty { min-height:240px; display:grid; place-content:center; text-align:center; gap:12px; color:var(--muted) }.empty h2 { color:var(--text); margin:0 }.primary { background:var(--accent); border-radius:8px; padding:8px 12px; color:white; margin:auto }
    .header-action { width:28px; height:28px; min-width:28px; padding:2px; border:0; background:transparent; color:var(--muted); font-size:17px; line-height:18px }
    .header-action:hover { background:transparent; color:var(--text) }
    .tab-usage { width:42px; height:4px; border-radius:4px; background:#17191e; overflow:hidden }
    .tab-usage i { display:block; height:100%; border-radius:inherit; background:var(--accent) }
    .settings-tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding-top:14px }.settings-tabs .tab { min-height:56px }.settings-block { padding:13px; margin-bottom:14px }.settings-block h3 { margin:0 0 11px; font-size:16px }.body:has(.about) .settings-block:not(.about) { background:transparent; border:0; padding:0; margin-bottom:18px }.choices { display:flex; gap:0; overflow:hidden; background:#30333a; border-radius:7px }.choice { flex:1; min-height:40px; background:transparent; border:0; border-right:1px solid #454955; border-radius:0; padding:7px 4px; color:var(--muted); text-align:center; font-size:12px }.choice:last-child { border-right:0 }.choice.active { color:var(--accent); background:#3b3d45 }.choice.active::before { content:'✓'; margin-right:5px }.choice .example { display:block; color:var(--muted); font-size:10px; margin-top:3px }.choice.active .example { color:var(--accent) }.toggle-row { display:flex; align-items:center; justify-content:space-between; min-height:30px }.toggle { position:relative; width:42px; height:24px; border-radius:20px; background:#535762; padding:3px; transition:.2s }.toggle.on { background:var(--accent) }.toggle i { display:block; width:18px; height:18px; border-radius:50%; background:white; transition:.2s }.toggle.on i { transform:translateX(18px) }.provider-account-header { display:flex; align-items:center; gap:9px; margin-bottom:10px }.provider-account-header img { width:24px; height:24px; object-fit:contain }.provider-account-header h3 { flex:1; margin:0; font-size:16px }.account-list { overflow:hidden; border-radius:7px; background:#30333a }.account-row { display:flex; align-items:center; gap:9px; min-height:50px; padding:8px 10px; border-bottom:1px solid #4a4e58 }.account-row:last-child { border-bottom:0 }.account-row .grow { flex:1; min-width:0 }.account-row small { display:block; color:var(--muted) }.account-row .delete-account { padding:4px 6px; background:transparent; color:#fff; font-size:15px; line-height:1 }.account-row .delete-account:hover { background:#4a4e58 }.mini { background:#464a55; border-radius:6px; padding:5px 8px; font-size:12px }.danger { color:#ff9a9a }.hint { color:var(--muted); font-size:12px; margin:0 0 9px }.about { color:var(--muted); line-height:1.55 }.about strong { color:var(--text) }

    .inline-action .inline-copy strong { display:block; font-size:14px; font-weight:600 }
    .inline-action .inline-copy small { display:block; margin-top:3px; color:#aeb2bd; font-size:10px }
    .inline-action .inline-chevron { color:#afb3bd; font-size:24px; line-height:1 }
    @media(max-width:500px){ .prototype-note{display:none}.popup{height:100vh;border:0} }
  </style>
</head>
<body>
  <div class="prototype-note">throwaway UI prototype · state resets on reload</div>
  <main class="popup" aria-label="YapCap UI prototype">
    <div id="chrome" class="chrome"></div>
    <div id="nav"></div>
    <div id="body" class="body"></div>
    <footer id="footer" class="footer"></footer>
  </main>
  <script>
    const providerIconPath='../providers/';
    const yapcapIconPath='../icon.svg';
    const providers=[
      {id:'codex',name:'Codex',icon:'codex-reversed.svg',email:'topi@example.com',accounts:['topi@example.com','work@example.com'],plan:'Plus',used:34,session:'1h 12m',weekly:52,enabled:true},
      {id:'claude',name:'Claude',icon:'claude-color.svg',email:'topi@example.com',accounts:['topi@example.com','team@example.com'],plan:'Max',used:71,session:'2h 18m',weekly:47,enabled:true},
      {id:'cursor',name:'Cursor',icon:'cursor-reversed.svg',email:'topi@example.com',accounts:[],plan:'Pro',used:19,session:'43m',weekly:35,enabled:true},
      {id:'gemini',name:'Gemini',icon:'gemini-color.svg',email:'topi@example.com',plan:'Pro',used:48,session:'3h 40m',weekly:63,enabled:true},
      {id:'copilot',name:'Copilot',icon:'copilot-reversed.svg',email:'topi@example.com',plan:'Pro+',used:82,session:'6 days',weekly:82,enabled:true},
      {id:'minimax',name:'Minimax',icon:'minimax-reversed.svg',email:'work key',plan:'API',used:27,session:'4h 5m',weekly:27,enabled:true},
      {id:'kimi',name:'Kimi',icon:'kimi-reversed.svg',email:'personal key',plan:'K2',used:56,session:'2h 10m',weekly:56,enabled:true}
    ];
    const query=new URLSearchParams(location.search); const requestedProvider=query.get('provider'); const initialProvider=providers.some(p=>p.id===requestedProvider)?requestedProvider:'cursor';
    const state={page:query.get('page')==='detail'?'detail':'accounts',provider:initialProvider,setting:initialProvider,accountPage:0,overviewStart:0,refresh:'5 min',amount:'Used',reset:'Relative',panel:'logo-bars',updateAvailable:true,availableVersion:'0.7.0'};
    const $=s=>document.querySelector(s); const icon=p=>`${providerIconPath}${p.icon}`; const current=()=>providers.find(p=>p.id===state.provider); const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    function tabs(items,selected,click,kind='tabs'){return `<div class="${kind}">${items.map(x=>`<button class="tab ${x.id===selected?'active':''}" data-${click}="${x.id}">${x.icon?`<img src="${icon(x)}" alt="">`:''}<span>${e(x.name)}</span>${x.weekly!==undefined?`<span class="tab-usage" aria-label="${x.weekly}% weekly usage"><i style="width:${x.weekly}%"></i></span>`:''}</button>`).join('')}</div>`}
    function overview(){const enabled=providers.filter(p=>p.enabled);const lastStart=Math.max(0,enabled.length-6);const visible=enabled.slice(state.overviewStart,state.overviewStart+6);return `<div class="overview overview-a" aria-label="Overview provider selector"><div class="overview-row"><button class="overview-arrow" data-overview-step="-1" aria-label="Previous providers" ${state.overviewStart===0?'disabled':''}>‹</button><div class="overview-viewport"><div class="provider-line">${visible.map(p=>`<button class="provider-choice ${p.id===state.provider?'active':''}" data-overview-provider="${p.id}" aria-label="${e(p.name)}" title="${e(p.name)}"><img src="${icon(p)}" alt=""></button>`).join('')}</div></div><button class="overview-arrow" data-overview-step="1" aria-label="Next providers" ${state.overviewStart===lastStart?'disabled':''}>›</button></div></div>`}
    function renderChrome(){ const isAbout=state.page==='about',isDetail=state.page==='detail',isSubpage=state.page==='settings'||state.page==='accounts'||state.page==='providers'; $('#chrome').innerHTML=isAbout||isSubpage?`<div class="header"><button class="text-button back" data-back>‹ Back</button></div>`:`<div class="header"><button class="title" data-home>YapCap</button><span class="spacer"></span><button class="icon-button header-action" data-about aria-label="About YapCap">ⓘ${state.updateAvailable?'<i class="notification-dot"></i>':''}</button><button class="icon-button header-action" data-manage-providers aria-label="Manage providers">☷</button><button class="icon-button header-action" data-settings aria-label="Settings">⚙</button><button class="icon-button header-action" data-refresh aria-label="Refresh">↻</button></div>`; $('#nav').innerHTML=isDetail?overview():''; }
    function accountSwitch(p,accounts){if(accounts.length===1)return '';const i=state.accountPage%accounts.length,dots=accounts.map((_,index)=>`<i class="${index===i?'active':''}"></i>`).join('');return `<div class="card-switcher wide"><button class="switch-arrow" data-account-page="-1">‹</button>${dots}<button class="switch-arrow" data-account-page="1">›</button></div>`}
    function manageAccounts(p){return `<button class="manage-accounts" data-manage-accounts="${p.id}"><span>Manage accounts</span><span>›</span></button>`}
    function accountCard(p,email){const accounts=accountsFor(p);return `<div class="detail-section"><div class="box-title">Account</div><section class="card account-card" data-account-card><div class="account"><div><strong>${e(email)}</strong></div><span class="plan">${p.plan}</span></div><div class="card-meta"><span class="badge">Live</span><span class="badge">Active</span><span class="updated">Updated just now</span></div>${manageAccounts(p)}${accountSwitch(p,accounts)}</section><div class="box-title">Usage</div><section class="card">${meter('Session',p.used,p.session)}${meter('Weekly',p.weekly,'4d 8h',true)}</section></div>`}
    function meter(label,value,reset,green=false){return `<div class="usage-window"><div class="window-info"><span>${label}</span></div><div class="meter ${green?'green':''}"><span style="width:${value}%"></span></div><div class="window-info"><small>${Number(value).toFixed(1)}% used</small><span class="reset-time">${reset}</span></div></div>`}
    function pager(p){const accounts=accountsFor(p);if(accounts.length===1)return '<div class="account-pager" aria-hidden="true"></div>';const i=state.accountPage%accounts.length;return `<div class="account-pager"><button class="pager-button" data-account-page="-1" aria-label="Previous account">‹</button><div><strong>${i+1}/${accounts.length}</strong></div><button class="pager-button" data-account-page="1" aria-label="Next account">›</button></div>`}
    function detail(){const p=current(),accounts=accountsFor(p);if(!accounts.length)return noAccountPage(p);const email=accounts[state.accountPage%accounts.length];return `<section class="provider-header"><img src="${icon(p)}" alt=""><strong>${p.name}</strong></section>${accountCard(p,email)}${p.id==='copilot'?`<section class="card"><div class="section-title"><span>Premium requests</span><small>Credits</small></div><strong>218 available</strong><div class="meter green"><span style="width:64%"></span></div></section>`:''}`}
    function general(){return `<section class="settings-block"><h3>Refresh interval</h3><div class="choices">${['1 min','5 min','15 min','30 min'].map(v=>`<button class="choice ${state.refresh===v?'active':''}" data-refresh-choice="${v}">${v}</button>`).join('')}</div></section><section class="settings-block"><h3>Panel icon</h3><div class="choices">${[['logo-bars','⌁▰',''],['bars','▰',''],['logo-percent','⌁ 86%',''],['percent','86%','']].map(([id,label])=>`<button class="choice ${state.panel===id?'active':''}" data-panel="${id}">${label}</button>`).join('')}</div></section><section class="settings-block"><h3>Reset time</h3><div class="choices">${['Relative','Absolute'].map(v=>`<button class="choice ${state.reset===v?'active':''}" data-reset="${v}">${v}<span class="example">${v==='Relative'?'Resets in 4h':'Today at 17:20'}</span></button>`).join('')}</div></section><section class="settings-block"><h3>Usage amount</h3><div class="choices">${['Used','Left'].map(v=>`<button class="choice ${state.amount===v?'active':''}" data-amount="${v}">${v}</button>`).join('')}</div></section>`}
    function providerHeading(p){return `<div class="provider-account-header"><img src="${icon(p)}" alt=""><h3>${p.name}</h3><button class="toggle ${p.enabled?'on':''}" data-toggle="${p.id}" aria-label="Toggle ${p.name}"><i></i></button></div>`}
    function supportsOpenCodeImport(p){return p.id==='codex'}
    function softAccountRow(p,email,index){return `<div class="soft-account-row"><span class="soft-account-copy"><strong>${e(email)}</strong></span><span class="soft-chevron">›</span><button class="delete-account" data-delete-account="${p.id}" data-account-index="${index}" aria-label="Remove ${e(email)}">🗑</button></div>`}
    function inlineImportAction(p){if(!supportsOpenCodeImport(p))return '';return `<button class="inline-action" data-import-opencode="${p.id}"><span class="inline-icon">↥</span><span class="inline-copy"><strong>Import from OpenCode</strong><small>Use a login already configured there</small></span><span class="inline-chevron">›</span></button>`}
    function providerAccountsPage(p,accounts){return `<section class="account-design design-f">${providerHeading(p)}<h2 class="accounts-title">Accounts</h2><div class="soft-group">${accounts.map((email,index)=>softAccountRow(p,email,index)).join('')}</div><div class="inline-actions"><button class="inline-action" data-add="${p.id}"><span class="inline-icon add">+</span><span class="inline-copy"><strong>Add account</strong></span><span class="inline-chevron">›</span></button>${inlineImportAction(p)}</div></section>`}
    function emptyAccountState(p){return `<div class="empty-account-state"><strong>No accounts</strong><p>Add an account to get started.</p><div class="empty-account-actions"><button class="empty-account-button primary" data-add="${p.id}"><span class="empty-action-icon">+</span><span>Add account</span></button>${supportsOpenCodeImport(p)?`<button class="empty-account-button secondary" data-import-opencode="${p.id}"><span class="empty-action-icon">↥</span><span>Import from OpenCode</span></button>`:''}</div></div>`}
    function accountsFor(p){return p.accounts??[p.email]}
    function noAccountPage(p){return `<section class="account-design no-account-page design-f">${providerHeading(p)}<h2 class="accounts-title">Accounts</h2>${emptyAccountState(p)}</section>`}
    function providerSettings(p){const accounts=accountsFor(p);if(!p.enabled)return `<section class="settings-block">${providerHeading(p)}<p class="hint">Enable this provider to manage accounts.</p></section>`;if(!accounts.length)return noAccountPage(p);return providerAccountsPage(p,accounts)}
    function manageProviders(){return `<div class="manage-providers"><h2>Manage providers</h2><div class="provider-settings-list">${providers.map(p=>`<div class="provider-settings-row"><img src="${icon(p)}" alt=""><strong>${e(p.name)}</strong><button class="toggle ${p.enabled?'on':''}" data-toggle="${p.id}" aria-label="Toggle ${p.name}"><i></i></button></div>`).join('')}</div></div>`}
    function settings(){return general();}
    function about(){return `<div class="about-page"><img class="app-logo" src="${yapcapIconPath}" alt=""><h1>Ledger</h1><span class="developer">netw0rkn1nja</span><span class="version">0.1.0</span><div class="about-group"><h2>Links</h2><a class="about-link" href="https://github.com/mrn3ff/cosmic-applet-ledger" target="_blank">Repository<span>↗</span></a><a class="about-link" href="https://github.com/mrn3ff/cosmic-applet-ledger/issues" target="_blank">Support<span>↗</span></a></div><div class="about-group"><h2>Developer</h2><a class="about-link" href="https://github.com/mrn3ff" target="_blank">mrn3ff<span>↗</span></a></div><div class="about-group"><h2>License</h2><a class="about-link" href="https://www.mozilla.org/en-US/MPL/2.0/" target="_blank">MPL-2.0-only<span>↗</span></a></div><div class="about-license"><strong>AI usage and credit monitor for the COSMIC desktop</strong></div></div>`}
    function renderBody(){ const isAbout=state.page==='about'; $('#body').innerHTML=isAbout?about():state.page==='detail'?detail():state.page==='accounts'?providerSettings(providers.find(p=>p.id===state.setting)):state.page==='providers'?manageProviders():settings(); $('#footer').innerHTML=isAbout||state.page==='detail'?'':`<span class="spacer"></span><button class="text-button" data-done>Done</button>`; renderChrome(); }
    function render(){renderBody(); bind();}
    function bind(){document.querySelectorAll('[data-overview-step]').forEach(b=>b.onclick=()=>{const total=providers.filter(p=>p.enabled).length;const lastStart=Math.max(0,total-6);state.overviewStart=Math.max(0,Math.min(lastStart,state.overviewStart+Number(b.dataset.overviewStep)));render()});document.querySelectorAll('[data-overview-provider]').forEach(b=>b.onclick=()=>{state.provider=b.dataset.overviewProvider;state.accountPage=0;render()});document.querySelectorAll('[data-provider]').forEach(b=>b.onclick=()=>{state.provider=b.dataset.provider;state.accountPage=0;render()});document.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>{state.setting=b.dataset.setting;render()});document.querySelectorAll('[data-manage-accounts]').forEach(b=>b.onclick=event=>{event.stopPropagation();state.setting=b.dataset.manageAccounts;state.page='accounts';render()});document.querySelectorAll('[data-manage-providers]').forEach(b=>b.onclick=()=>{state.page='providers';render()});document.querySelectorAll('[data-account-page]').forEach(b=>b.onclick=event=>{event.stopPropagation();const total=(current().accounts||[current().email]).length;state.accountPage=(state.accountPage+Number(b.dataset.accountPage)+total)%total;render()});document.querySelectorAll('[data-account-card]').forEach(b=>b.onclick=()=>{const total=(current().accounts||[current().email]).length;if(total>1){state.accountPage=(state.accountPage+1)%total;render()}});document.querySelectorAll('[data-delete-account]').forEach(b=>b.onclick=event=>{event.stopPropagation();const provider=providers.find(p=>p.id===b.dataset.deleteAccount);provider.accounts??=[provider.email];provider.accounts.splice(Number(b.dataset.accountIndex),1);if(!provider.accounts.length)provider.accounts=[provider.email];render()});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{const provider=providers.find(p=>p.id===b.dataset.toggle);provider.enabled=!provider.enabled;if(state.page==='detail'&&!current().enabled)state.provider=providers.find(p=>p.enabled)?.id||'codex';state.overviewStart=0;render()});document.querySelectorAll('[data-refresh-choice]').forEach(b=>b.onclick=()=>{state.refresh=b.dataset.refreshChoice;render()});document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{state.panel=b.dataset.panel;render()});document.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{state.reset=b.dataset.reset;render()});document.querySelectorAll('[data-amount]').forEach(b=>b.onclick=()=>{state.amount=b.dataset.amount;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>alert(`Prototype: would start ${b.dataset.add} sign-in.`));document.querySelectorAll('[data-import-opencode]').forEach(b=>b.onclick=()=>alert(`Prototype: would import a ${b.dataset.importOpencode} account from OpenCode.`));const home=$('[data-home]');if(home)home.onclick=()=>{state.page='detail';render()};const info=$('[data-about]');if(info)info.onclick=()=>{state.page='about';render()};const back=$('[data-back]');if(back)back.onclick=()=>{state.page='detail';render()};const settings=$('[data-settings]');if(settings)settings.onclick=()=>{state.page='settings';state.setting='general';render()};const done=$('[data-done]');if(done)done.onclick=()=>{state.page='detail';render()};const refresh=$('[data-refresh]');if(refresh)refresh.onclick=()=>{refresh.textContent='↻';setTimeout(()=>{refresh.textContent='↻'},600)}}
    render();
  </script>
</body>
</html>
