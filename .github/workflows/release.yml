name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libfontconfig-dev \
            libexpat1-dev \
            libfreetype6-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cosmic-applet-ledger") | .version')"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "tag version $TAG_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi

      - name: Install packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release

      - name: Package tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="cosmic-applet-ledger-${VERSION}-x86_64-linux"
          mkdir -p "dist/${PKG}"
          cp target/release/cosmic-applet-ledger "dist/${PKG}/"
          cp README.md LICENSE "dist/${PKG}/"
          cp -r resources "dist/${PKG}/"
          tar -czf "dist/${PKG}.tar.gz" -C dist "${PKG}"

      - name: Build .deb and .rpm
        run: |
          cargo deb --no-build --output dist/
          cargo generate-rpm
          cp target/generate-rpm/*.rpm dist/

      - name: Generate checksums
        working-directory: dist
        run: |
          shopt -s nullglob
          sha256sum *.tar.gz *.deb *.rpm > checksums.txt
          cat checksums.txt

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/checksums.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
